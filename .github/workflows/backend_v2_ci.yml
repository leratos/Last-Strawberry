name: Backend V2 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  backend_v2_tests:
    name: backend_v2_tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend_v2/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_v2/requirements.txt

      - name: Run tests with coverage
        run: |
          python -m pytest backend_v2/tests \
            --cov=backend_v2.app \
            --cov-fail-under=65 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          slug: leratos/Last-Strawberry
          files: coverage.xml
          name: backend_v2
          use_oidc: true
          verbose: true
          fail_ci_if_error: true
